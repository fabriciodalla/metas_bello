# Cloudflare Tunnel (ou qualquer proxy na frente) já entrega X-Forwarded-Proto quando a conexão do
# lado de fora é HTTPS — preserva esse valor; só cai pro esquema da conexão local ($scheme) se não
# vier nada (ex.: acesso direto, sem túnel). É o que permite ao Django (SECURE_PROXY_SSL_HEADER)
# saber se deve tratar a requisição como HTTPS sem esta camada nginx precisar terminar TLS.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        # Reescreve o Host pro alvo interno (mesmo motivo do `changeOrigin` do Vite em dev) —
        # mantém DJANGO_ALLOWED_HOSTS igual em dev e produção, sem precisar saber de antemão o
        # domínio público do túnel.
        proxy_set_header Host backend:8000;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host backend:8000;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host backend:8000;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA: qualquer rota que não seja arquivo estático cai no index.html (roteamento client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
