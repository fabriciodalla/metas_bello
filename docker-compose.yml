services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metas_bello}
      POSTGRES_USER: ${POSTGRES_USER:-metas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metas}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./api:/src/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-metas}:${POSTGRES_PASSWORD:-metas}@db:5432/${POSTGRES_DB:-metas_bello}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ERP_DB_HOST: ${ERP_DB_HOST:-}
      ERP_DB_PORT: ${ERP_DB_PORT:-5432}
      ERP_DB_NAME: ${ERP_DB_NAME:-}
      ERP_DB_SCHEMA: ${ERP_DB_SCHEMA:-stage}
      ERP_DB_USER: ${ERP_DB_USER:-}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:-}
      ERP_DB_SSLMODE: ${ERP_DB_SSLMODE:-prefer}
      ERP_DB_SALES_HISTORY_RELATION: ${ERP_DB_SALES_HISTORY_RELATION:-cr8be_vendas_bello_2}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8000}
    depends_on:
      - api

volumes:
  postgres_data:
