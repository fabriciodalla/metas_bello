# Stack de produção (M-02): gunicorn no lugar de `manage.py runserver`, build estático do frontend
# servido por nginx no lugar do dev server do Vite. Arquivo separado do docker-compose.yml (dev) de
# propósito — não interfere no fluxo de desenvolvimento com hot-reload documentado no CLAUDE.md.
#
# Deploy via Coolify: a plataforma cuida da rede/roteamento (Traefik, HTTPS) e grava as variáveis
# configuradas no painel em `.env`, no diretório do projeto — é esse arquivo que o `env_file` do
# backend abaixo espera. O serviço `frontend` não publica porta no host de propósito: no Coolify o
# roteamento é pela rede interna do Docker, e publicar porta só criaria um caminho HTTP paralelo ao
# Traefik/HTTPS.
#
# Uso local (fora do Coolify, para testar a build de produção manualmente):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# (copie .env.prod.example para `.env` antes de rodar a partir deste diretório — não rode ao mesmo
# tempo que o `docker-compose.yml` de desenvolvimento, que usa esse mesmo nome de arquivo para
# outro propósito.)
#
# Sem `name:` fixo de propósito: era necessário quando dev e produção rodavam na mesma máquina
# (incidente real, 2026-09-11 — sem `name`, o Compose deriva o nome do projeto do nome da pasta, e
# subir esta stack sem isso derrubou e recriou backend/db/frontend do dev com as imagens de
# produção). Nesta VPS não há stack de desenvolvimento, então o Coolify gerencia o nome do projeto
# sozinho, sem esse risco de colisão.
# ATENÇÃO ao reintroduzir `name:` (ou trocar seu valor) depois do primeiro deploy nesta VPS: o
# volume nomeado `postgres_data_prod` abaixo é escopado pelo nome do projeto — mudar isso com dados
# já em produção faz o Compose subir com um volume novo e vazio, sem apagar o antigo, mas deixando-
# o órfão e invisível pro app (parece perda de dados).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metasbello}
      POSTGRES_USER: ${POSTGRES_USER:-metasbello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metasbello}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data_prod:
